server:
  port: 8080
  mode: debug
  # 空值會停用 X-Forwarded-For 信任；生產環境以 SERVER_TRUSTED_PROXIES 明確設定。
  trusted_proxies: ""

database:
  driver: sqlite
  dsn: "tao_core.db"
  max_open_connections: 50
  max_idle_connections: 10
  connection_max_lifetime_minutes: 30
  # release + PostgreSQL 預設拒絕 sslmode=disable；隔離的內部容器網路才可顯式允許。
  allow_insecure_internal: false

jwt:
  expire_hours: 24

# JWT_ISSUER 與 JWT_AUDIENCE 也必須由執行環境提供。

security:
  # APP_ENCRYPTION_KEY 必須由環境提供（base64 編碼的 32 bytes）。
  encryption_key: ""

# JWT_SECRET 必須由執行環境提供，且至少 32 bytes。

demo:
  # 僅供本地展示；生產環境必須維持 false。
  seed_enabled: false

webhook:
  worker_pool_size: 5
  # WEBHOOK_ALLOWED_HOSTS 必須由環境提供，以逗號分隔，例如 hooks.example.com,*.trusted.example
  allowed_hosts: ""
