version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tao-core-go-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_MODE=release
      - DATABASE_DRIVER=postgres
      - DATABASE_DSN=host=postgres user=tao password=taopass dbname=tao_core_db port=5432 sslmode=disable TimeZone=Asia/Taipei
      - REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: tao-core-go-postgres
    restart: always
    environment:
      POSTGRES_USER: tao
      POSTGRES_PASSWORD: taopass
      POSTGRES_DB: tao_core_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tao -d tao_core_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tao-core-go-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  app_uploads:
