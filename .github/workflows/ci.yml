name: TAO Core Go CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Security, Test, and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: tao
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: tao_core_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tao -d tao_core_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Verify dependency checksums and formatting
        run: |
          go mod verify
          test -z "$(gofmt -l .)"

      - name: Run vet and static analysis
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Run vulnerability and security scans
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...

      - name: Run race tests and coverage gates
        run: |
          go test -race -coverprofile=coverage.out ./...
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v coverage="${total}" 'BEGIN { if (coverage + 0 < 55) { print "total coverage below 55%: " coverage "%"; exit 1 } }'
          go test -coverprofile=handler-coverage.out ./internal/handler
          handler="$(go tool cover -func=handler-coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v coverage="${handler}" 'BEGIN { if (coverage + 0 < 80) { print "handler coverage below 80%: " coverage "%"; exit 1 } }'

      - name: Verify static Linux build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/tao-core-go ./cmd/server

      - name: Verify PostgreSQL migration and process-level E2E
        env:
          DATABASE_DRIVER: postgres
          DATABASE_DSN: host=127.0.0.1 user=tao password=ci-only-postgres-password dbname=tao_core_ci port=5432 sslmode=disable
          DATABASE_ALLOW_INSECURE_INTERNAL: 'true'
          SERVER_MODE: release
          E2E_DATABASE_DRIVER: postgres
          E2E_DATABASE_DSN: host=127.0.0.1 user=tao password=ci-only-postgres-password dbname=tao_core_ci port=5432 sslmode=disable
          E2E_DATABASE_ALLOW_INSECURE_INTERNAL: 'true'
        run: |
          sh -n scripts/*.sh
          go run ./cmd/migrate -mode up
          go run ./cmd/migrate -mode verify
          ./scripts/run-e2e.sh

      - name: Verify Docker build
        run: docker build --pull=false -t tao-core-go:ci .
